name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Bundle portable Christmas Forge
        run: npm run build:gingerlight
      - name: Rebuild Moonveil reference mansion with current Forge
        run: node tools/rebuild-reference-mansion.mjs
      - name: Catalog prepared CASA houses
        run: node tools/build-casa-street.mjs
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html casa_game.html casa_admin.html _site/
          cp -R casa_game casa_admin _site/
          cp -R north_pole _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
