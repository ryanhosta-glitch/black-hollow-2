name: CASA Forge regressions
on:
  pull_request:
  push:
    branches: [main, development/victorian-forge, dev/haunted-midway]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:gingerlight
      - run: npm run build:gingerlight
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [midway, midway-signatures, midway-scenes, midway-park, atmosphere, storytelling, lighting, heirloom, luxury, playpack, household, nocturne, release-entry, townlife, polish, afterlife, village, magic, playtest-pass, scares, phoenix, forge, stairs, pipeline, reactions, rooms, organ, halloween, town, student-readiness, batch, street-memory, runtime-cleanup, directors-pass, reference, gingerlight, gingerlight-student, gingerlight-console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install chromium
      - run: node tools/prepare-test-houses.mjs
      - if: matrix.suite == 'gingerlight' || matrix.suite == 'gingerlight-student' || matrix.suite == 'gingerlight-console'
        run: npm run build:gingerlight
      - run: node tests/browser-${{ matrix.suite }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-browser-evidence-${{ matrix.suite }}
          path: tests/artifacts/
